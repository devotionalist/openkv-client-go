syntax = "proto3";

package kv.v1;

option go_package = "github.com/devotionalist/openkv-client-go/gen/kv/v1;kvv1";
option cc_enable_arenas = true;

// 对外 KV API，由 Compute Proxy 提供
service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // 无事务平面：无 TSO/无 MVCC；与 Put/Get 同 key 空间，勿混用同 key。
  rpc RawGet(RawGetRequest) returns (RawGetResponse);
  rpc RawPut(RawPutRequest) returns (RawPutResponse);
  rpc RawDelete(RawDeleteRequest) returns (RawDeleteResponse);
  rpc BatchGet(BatchGetRequest) returns (BatchGetResponse);
  rpc BatchPut(BatchPutRequest) returns (BatchPutResponse);
  // MVCC 范围扫描（用户键语义）；ListPrefix = prefix + prefix_upper_bound
  rpc Scan(ScanRequest) returns (ScanResponse);
  // 用户 KV TTL：查询剩余 / 改相对寿命 / 永久化（见 docs/flows/14-kv-ttl.md）
  rpc TTL(TTLRequest) returns (TTLResponse);
  rpc Expire(ExpireRequest) returns (ExpireResponse);
  rpc Persist(PersistRequest) returns (PersistResponse);
  rpc Watch(WatchRequest) returns (stream WatchEvent);

  // Percolator 乐观事务（无 SQL）
  rpc TxnBegin(TxnBeginRequest) returns (TxnBeginResponse);
  rpc TxnGet(TxnGetRequest) returns (TxnGetResponse);
  rpc TxnPrewrite(TxnPrewriteRequest) returns (TxnPrewriteResponse);
  rpc TxnCommit(TxnCommitRequest) returns (TxnCommitResponse);
  rpc TxnRollback(TxnRollbackRequest) returns (TxnRollbackResponse);
  rpc TxnPessimisticLock(TxnPessimisticLockRequest) returns (TxnPessimisticLockResponse);
  rpc TxnPessimisticRollback(TxnPessimisticRollbackRequest) returns (TxnPessimisticRollbackResponse);
  rpc TxnResolveLock(TxnResolveLockRequest) returns (TxnResolveLockResponse);
  rpc TxnCheckStatus(TxnCheckStatusRequest) returns (TxnCheckStatusResponse);
}

message GetRequest {
  bytes key = 1;
  // 是否要求线性一致读（仅 Leader）
  bool linearizable = 2;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
  uint64 revision = 3;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  int64 ttl_ms = 3;  // 0 = 永不过期
  // cas=true：按 expected_revision 做版本 CAS（见 docs/flows/13-version-cas.md）
  // expected_revision=0 表示 create-only（key 必须尚无已提交版本）
  bool cas = 4;
  uint64 expected_revision = 5;
}

message PutResponse {
  uint64 revision = 1;
  bool ok = 2;
  bool cas_failed = 3;
  uint64 current_revision = 4;  // cas 失败时的当前版本；不存在为 0
}

message DeleteRequest {
  bytes key = 1;
  bool cas = 2;
  uint64 expected_revision = 3;
}

message DeleteResponse {
  bool deleted = 1;
  uint64 revision = 2;
  bool cas_failed = 3;
  uint64 current_revision = 4;
}

// Raw*：plain KvRecord；revision = Raft apply index（非 commit_ts）。
message RawGetRequest {
  bytes key = 1;
  bool linearizable = 2;
}

message RawGetResponse {
  bytes value = 1;
  bool found = 2;
  uint64 revision = 3;
}

message RawPutRequest {
  bytes key = 1;
  bytes value = 2;
  int64 ttl_ms = 3;
  bool cas = 4;
  uint64 expected_revision = 5;
}

message RawPutResponse {
  uint64 revision = 1;
  bool ok = 2;
  bool cas_failed = 3;
  uint64 current_revision = 4;
}

message RawDeleteRequest {
  bytes key = 1;
  bool cas = 2;
  uint64 expected_revision = 3;
}

message RawDeleteResponse {
  bool deleted = 1;
  uint64 revision = 2;
  bool cas_failed = 3;
  uint64 current_revision = 4;
}

message BatchGetRequest {
  repeated bytes keys = 1;
  bool linearizable = 2;
}

message BatchGetResponse {
  repeated GetResponse results = 1;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message BatchPutRequest {
  repeated KeyValue items = 1;
}

message BatchPutResponse {
  repeated PutResponse results = 1;
}

// Scan：半开区间 [start_key, end_key)；prefix 非空时等价 start=prefix、end=prefix_upper_bound。
// start_after 非空时从该键之后续扫（分页游标，排他）。
message ScanRequest {
  bytes prefix = 1;
  bytes start_key = 2;
  bytes end_key = 3;       // exclusive；空=不限（仍受 limit）
  bytes start_after = 4;   // exclusive cursor
  uint32 limit = 5;        // 0 → 默认 256；服务端硬顶
  bool keys_only = 6;
  bool linearizable = 7;   // true=Leader+TSO；false=任意副本本地快照
}

message ScanPair {
  bytes key = 1;
  bytes value = 2;
  uint64 revision = 3;  // 可见版本 commit_ts
}

message ScanResponse {
  repeated ScanPair pairs = 1;
  bool truncated = 2;
  bytes next_key = 3;  // truncated 时下一页 start_after
}

// TTL：ttl_ms = -2 不存在/已过期；-1 永久；>=0 剩余毫秒
message TTLRequest {
  bytes key = 1;
  bool linearizable = 2;
}
message TTLResponse {
  int64 ttl_ms = 1;
}

// Expire：相对 ttl_ms；0 等价 Persist。key 不存在 → found=false
message ExpireRequest {
  bytes key = 1;
  int64 ttl_ms = 2;
}
message ExpireResponse {
  bool ok = 1;
  bool found = 2;
  uint64 revision = 3;
}

message PersistRequest {
  bytes key = 1;
}
message PersistResponse {
  bool ok = 1;
  bool found = 2;
  uint64 revision = 3;
}

message WatchRequest {
  bytes key = 1;
  bytes key_prefix = 2;
  uint64 start_revision = 3;
}

message WatchEvent {
  enum Type {
    PUT = 0;
    DELETE = 1;
  }
  Type type = 1;
  bytes key = 2;
  bytes value = 3;
  uint64 revision = 4;
}

message TxnBeginRequest {
  uint32 count = 1;  // 预分配时间戳个数，默认 1
}

message TxnBeginResponse {
  uint64 start_ts = 1;
}

message TxnGetRequest {
  bytes key = 1;
  uint64 start_ts = 2;
}

message TxnGetResponse {
  bytes value = 1;
  bool found = 2;
  bool locked = 3;
  // 可见版本的 commit_ts（无版本为 0）；Gateway Get 的 revision 取此字段
  uint64 revision = 4;
}

message TxnMutation {
  bytes key = 1;
  bytes value = 2;
  bool is_delete = 3;
}

message TxnPrewriteRequest {
  uint64 start_ts = 1;
  bytes primary_key = 2;
  repeated TxnMutation mutations = 3;
  // 单 key / 各 mutation 共用：对每个 mutation 校验最新 commit_ts
  bool cas = 4;
  uint64 expected_revision = 5;
  // 用户 KV TTL：绝对过期时间 unix ms（0=永久）。由 Gateway 在 Put 时 stamp。
  int64 expire_at_ms = 6;
}

message TxnPrewriteResponse {
  bool ok = 1;
  string error = 2;
  bool cas_failed = 3;
  uint64 current_revision = 4;
}

message TxnCommitRequest {
  uint64 start_ts = 1;
  bytes primary_key = 2;
  repeated bytes keys = 3;  // 含 primary；先 commit primary 再 secondary
}

message TxnCommitResponse {
  bool ok = 1;
  uint64 commit_ts = 2;
  string error = 3;
}

message TxnRollbackRequest {
  uint64 start_ts = 1;
  repeated bytes keys = 2;
}

message TxnRollbackResponse {
  bool ok = 1;
  string error = 2;
}

message TxnPessimisticLockRequest {
  uint64 start_ts = 1;
  uint64 for_update_ts = 2;
  bytes primary_key = 3;
  repeated bytes keys = 4;
  uint64 ttl_ms = 5;
}

message TxnPessimisticLockResponse {
  bool ok = 1;
  string error = 2;
}

message TxnPessimisticRollbackRequest {
  uint64 start_ts = 1;
  repeated bytes keys = 2;
}

message TxnPessimisticRollbackResponse {
  bool ok = 1;
  string error = 2;
}

message TxnResolveLockRequest {
  bytes key = 1;
  uint64 start_ts = 2;
  uint64 commit_ts = 3;  // 0 = rollback
}

message TxnResolveLockResponse {
  bool ok = 1;
  string error = 2;
}

message TxnCheckStatusRequest {
  bytes primary_key = 1;
  uint64 lock_ts = 2;
}

message TxnCheckStatusResponse {
  string status = 1;  // locked|expired|committed|rolledback
  uint64 commit_ts = 2;
}
